apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: default
spec:
  serviceName: "minecraft-service"
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: minecraft-server
          image: 625392048444.dkr.ecr.us-east-1.amazonaws.com/cs312-minecraft-server:v1.0.0 
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 25565
              name: minecraft
          envFrom:
            - configMapRef:
                name: minecraft-config
          resources:
            requests:
              memory: "2.5Gi" # Gives breathing room for the 2G Java heap + overhead
              cpu: "1000m"    # Requests 1 full vCPU core minimum
            limits:
              memory: "3Gi"   # Prevents runaway memory allocation from causing host thrashing
              cpu: "1500m"   # Restricts CPU scaling past 1.5 cores to respect cost boundaries
          startupProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 30 # Wait 30 seconds before checking for the first time
            periodSeconds: 10
            failureThreshold: 15 # Allows up to 150 additional seconds (15 * 10) to finish starting up
          livenessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 20 # Routinely checks if port is listening every 20 seconds
          volumeMounts:
            - name: minecraft-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minecraft-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi # Standard disk allocation for single-node local-path persistence